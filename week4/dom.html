<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dior Shopping Cart</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:linear-gradient(to right,#f5f5f5,#e6e6e6);
            text-align:center;
            padding:40px;
        }

        h1{
            color:#111;
            margin-bottom:25px;
            font-size:38px;
            text-transform:uppercase;
            letter-spacing:2px;
        }

        input{
            width:280px;
            padding:12px;
            margin:10px;
            border:2px solid #ccc;
            border-radius:8px;
            font-size:16px;
            transition:0.3s;
        }

        input:focus{
            border-color:black;
            outline:none;
            box-shadow:0 0 8px rgba(0,0,0,0.3);
        }

        button{
            padding:12px 25px;
            background:black;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#444;
            transform:scale(1.05);
        }

        #container{
            display:flex;
            justify-content:center;
            flex-wrap:wrap;
            gap:20px;
            margin-top:35px;
        }

        .card{
            width:260px;
            background:white;
            border-radius:12px;
            padding:20px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-8px);
            box-shadow:0 10px 20px rgba(0,0,0,0.3);
        }

        .card h2{
            color:#000;
            margin-bottom:10px;
            font-size:26px;
        }

        .card h3{
            color:#555;
            margin-bottom:10px;
        }

        .card p{
            color:green;
            font-size:20px;
            font-weight:bold;
        }

        #total{
            margin-top:30px;
            font-size:28px;
            color:#d60000;
            font-weight:bold;
        }
    </style>
</head>

<body>

    <h1>Dior Shopping Cart</h1>

    <input
        type="text"
        id="productName"
        placeholder="Product Name"
    >

    <input
        type="number"
        id="productPrice"
        placeholder="Price"
    >

    <button onclick="addProduct()">
        Add Product
    </button>

    <div id="container"></div>

    <h2 id="total">Total Price : ₹0</h2>

    <script src="dior.js"></script>

</body>
</html>
